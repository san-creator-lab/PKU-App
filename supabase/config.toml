# Supabase CLI configuration for Hero Fuel.
# Used by `npx supabase start` (local Docker stack) and `npx supabase db push`
# (hosted project after `npx supabase link`).

project_id = "hero-fuel"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "10MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["https://localhost:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
# Family devices sign in with email+password only; no SMTP needed locally.
enable_confirmations = false

[realtime]
enabled = true

[functions.ocr-label]
# The scanner calls this with the user's JWT; keep verification on.
verify_jwt = true
